services:
  db:
    image: postgres:16
    container_name: real_estate_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/work/data:ro
      - ./outputs:/work/outputs:ro

volumes:
  pgdata:
