services:
  db:
    image: postgres:16
    container_name: real_estate_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yama
      POSTGRES_PASSWORD: yama_pw
      POSTGRES_DB: real_estate
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/work/data:ro
      - ./outputs:/work/outputs:ro

volumes:
  pgdata:
